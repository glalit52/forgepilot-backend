name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fp
          POSTGRES_PASSWORD: fp
          POSTGRES_DB: fp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Once on the embedded database, once on real Postgres (pooling, row locks, LISTEN/NOTIFY).
      - run: pnpm test
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://fp:fp@localhost:5432/fp
      - run: pnpm build
